<!DOCTYPE html>
<html>
<head>
    <title>Exercise Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Workout Buddy</h1>
        
        <div class="content-wrapper">
            <!-- Exercise List Section -->
            <div class="exercise-list">
                <!-- This div will be populated by JavaScript -->
                <div id="exerciseList"></div>
            </div>

            <!-- Add Workout Form Section -->
            <div class="add-workout">
                <h2>Add a New Workout</h2>
                <div class="input-group">
                    <label>Exercise Title:</label>
                    <input type="text" id="exercise" placeholder="Enter exercise">
                </div>
                <div class="input-group">
                    <label>Load (in kg):</label>
                    <input type="number" id="load" placeholder="Enter load" min="0">
                </div>
                <div class="input-group">
                    <label>Reps:</label>
                    <input type="number" id="reps" placeholder="Enter reps" min="1">
                </div>
                <button class="btn" onclick="addExercise()">Add Workout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
